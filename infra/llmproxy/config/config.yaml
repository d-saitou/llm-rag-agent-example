model_list:
  - model_name: default
    litellm_params:
      # 使用可能モデル確認：curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer ${GROK APIキー}"
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: coding
    litellm_params:
      # 使用可能モデル確認(Ollama)：curl http://host.docker.internal:11434/api/tags
      model: ollama/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  request_timeout: 60
  max_parallel_requests: 20
  set_verbose: true
  allowed_models:
    - default
    - coding

router_settings:
  # fallbacks:
  #   - {"default": ["coding"]}
  # routing_strategy: least-busy
  num_retries: 2

